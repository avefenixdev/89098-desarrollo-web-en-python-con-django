<!DOCTYPE html>
<html>

<head>
    <title>Mi sitio desde Template</title>
</head>

<body>
    <h1>Bienvenido</h1>
    <p>Esta es mi página principal.</p>

    <h2>Listado de usuarios</h2>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Edad</th>
            </tr>
        </thead>
        <tbody>
            {% for usuario in usuarios %}
                <tr>
                    <td>{{ usuario.nombre }}</td>
                    <td>{{ usuario.edad }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>

</html>
